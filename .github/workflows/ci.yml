name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml runs the checks before it tags.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv python install
      - run: uv sync --locked
      - run: . host/versions.sh && npm install --global "@anthropic-ai/claude-code@$claude_code"
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: claude plugin validate --strict .
      - run: python3 bin/check-project.py
