name: agent-review

# The only source of the required check `agent-review`; agent-review-sync.yml
# re-runs it after a review.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  agent-review:
    runs-on: ubuntu-latest
    steps:
      # The action gets the review key, so its code comes from the base, never
      # from the branch of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: ./actions/agent-review
        with:
          pr: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          review-key: ${{ secrets.PIPELINE_REVIEW_KEY }}
