name: agent-review-audit

# Detects a merge by hand or a bypass where GitHub enforces no ruleset; it does not
# prevent one. The issue it opens reaches the maintainer as a new followup issue.
on:
  push:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  agent-review-audit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.claude/skills/pipeline/actions/agent-review-audit
        with:
          sha: ${{ github.sha }}
          review-key: ${{ secrets.PIPELINE_REVIEW_KEY }}
