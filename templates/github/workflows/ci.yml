name: CI

# Add the steps for the project's checks from .claude/rules/project.md.
on:
  pull_request:
  # The default branch, if it is not main.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: .claude/skills/pipeline/bin/check-project.py
