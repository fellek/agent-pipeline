name: agent-review-sync

# A green run of a review does not replace a red run of the push for the required
# check, so the run of the push is re-run instead. The job has its own name, so it
# adds no second agent-review check.
on:
  pull_request_review:
    types: [submitted, dismissed]

# No cancel-in-progress: a cancelled sync could leave the check behind the verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  agent-review-sync:
    # The token of a fork's pull request is read-only, so a sync there could only fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # The action gets the review key, so its code comes from the base, never
      # from the branch of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          submodules: true
      - uses: ./.claude/skills/pipeline/actions/agent-review-sync
        with:
          pr: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          review-key: ${{ secrets.PIPELINE_REVIEW_KEY }}
