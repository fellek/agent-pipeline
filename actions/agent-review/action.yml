name: agent-review
description: 'Fail unless the latest review on the head commit of a pull request is an attested approve of the gate'
inputs:
  pr:
    description: Pull request number
    required: true
  head-sha:
    description: Head commit of the pull request
    required: true
  github-token:
    description: Token with read access to the pull request's reviews
    default: ${{ github.token }}
  review-key:
    description: Review key of the gate (secret PIPELINE_REVIEW_KEY); without it a review counts without attestation
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ inputs.pr }}
        HEAD_SHA: ${{ inputs.head-sha }}
        PIPELINE_REVIEW_KEY: ${{ inputs.review-key }}
      run: '"$GITHUB_ACTION_PATH/../../bin/agent-review.py" "$PR" "$HEAD_SHA"'
